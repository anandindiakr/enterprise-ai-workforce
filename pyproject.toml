[project]
name = "ai-workforce"
version = "0.1.0"
description = "Enterprise Multi-Agent AI Workforce Platform with Chat + Real-Time Voice (Swarms Framework)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AI Workforce Team" }]

dependencies = [
    "swarms>=8.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "redis[hiredis]>=5.1.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "chromadb>=0.5.15",
    "openai>=1.54.0",
    "anthropic>=0.37.0",
    "litellm>=1.51.0",
    "httpx>=0.27.2",
    "aiohttp>=3.10.10",
    "tenacity>=9.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "celery[redis]>=5.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-client>=0.21.0",
    "slowapi>=0.1.9",
    # Voice
    "deepgram-sdk>=3.7.0",
    "elevenlabs>=1.10.0",
    "twilio>=9.3.0",
    "livekit>=0.17.0",
    "livekit-api>=0.7.0",
    "aiortc>=1.9.0",
    "numpy>=1.26.4",
    "soundfile>=0.12.1",
    # MCP
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "black>=24.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
