apiVersion: v1
kind: Namespace
metadata:
  name: ai-workforce
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-workforce-config
  namespace: ai-workforce
data:
  APP_ENV: "production"
  APP_NAME: "AI Workforce Platform"
  REDIS_URL: "redis://redis:6379/0"
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  TELEMETRY_LOG_LEVEL: "INFO"
  RATE_LIMIT_PER_MIN: "120"
  CORS_ORIGINS: "*"
