apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-workforce-api
  namespace: ai-workforce
  labels:
    app: ai-workforce-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-workforce-api
  template:
    metadata:
      labels:
        app: ai-workforce-api
    spec:
      containers:
        - name: api
          image: ai-workforce/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: ai-workforce-config
            - secretRef:
                name: ai-workforce-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/platform/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/platform/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-workforce-api
  namespace: ai-workforce
spec:
  type: ClusterIP
  selector:
    app: ai-workforce-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-workforce-api
  namespace: ai-workforce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-workforce-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-workforce-api
  namespace: ai-workforce
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "ai-workforce-api"
spec:
  ingressClassName: nginx
  rules:
    - host: api.workforce.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-workforce-api
                port:
                  number: 80
