# ── Frontend Deployment ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-workforce-frontend
  namespace: ai-workforce
  labels:
    app: ai-workforce-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-workforce-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ai-workforce-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/YOUR_ORG/ai-workforce-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.workforce.yourdomain.com"
            - name: NEXT_PUBLIC_WS_URL
              value: "wss://api.workforce.yourdomain.com"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: ai-workforce-frontend
  namespace: ai-workforce
spec:
  selector:
    app: ai-workforce-frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP

---
# ── Ingress ────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-workforce-ingress
  namespace: ai-workforce
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  tls:
    - hosts:
        - workforce.yourdomain.com
        - api.workforce.yourdomain.com
      secretName: ai-workforce-tls
  rules:
    - host: workforce.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-workforce-frontend
                port:
                  number: 3000
    - host: api.workforce.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-workforce-api
                port:
                  number: 8080
