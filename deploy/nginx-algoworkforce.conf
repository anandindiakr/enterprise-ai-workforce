# AlgoWorkforce — Nginx virtual host
# Safe to add alongside other Nginx sites — only handles algoworkforce.com
#
# INSTALL STEPS (run once on VPS):
#   cp /root/enterprise-ai-workforce/deploy/nginx-algoworkforce.conf \
#      /etc/nginx/sites-available/algoworkforce.com
#   ln -s /etc/nginx/sites-available/algoworkforce.com \
#         /etc/nginx/sites-enabled/algoworkforce.com
#   nginx -t
#   systemctl reload nginx
#   certbot --nginx -d algoworkforce.com -d www.algoworkforce.com

# HTTP redirect
server {
    listen 80;
    listen [::]:80;
    server_name algoworkforce.com www.algoworkforce.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.algoworkforce.com$request_uri;
    }
}

# HTTPS — certbot will inject ssl_certificate lines automatically
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name algoworkforce.com www.algoworkforce.com;

    # ssl_certificate     /etc/letsencrypt/live/algoworkforce.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/algoworkforce.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # WebSocket to FastAPI
    location /ws/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API to FastAPI
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass         http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
