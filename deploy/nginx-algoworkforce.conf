# nginx virtual host for the AI Workforce platform on a SHARED VPS that already
# runs the system nginx on ports 80/443 for other sites (e.g. the ACOM ERP).
#
# Install on the VPS:
#   sudo cp deploy/nginx-algoworkforce.conf /etc/nginx/sites-available/algoworkforce.conf
#   sudo ln -sf /etc/nginx/sites-available/algoworkforce.conf /etc/nginx/sites-enabled/algoworkforce.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d www.algoworkforce.com -d algoworkforce.com
#
# certbot will automatically inject the TLS (listen 443 ssl) config and an
# HTTP->HTTPS redirect, so this file only needs the plain :80 server blocks.
#
# Routing:
#   /api/  -> FastAPI backend published on the host at 127.0.0.1:8080
#             (REST + WebSocket upgrades)
#   /      -> Next.js frontend published on the host at 127.0.0.1:3100

# Redirect the apex to the canonical www host.
server {
    listen 80;
    listen [::]:80;
    server_name algoworkforce.com;
    return 301 https://www.algoworkforce.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.algoworkforce.com;

    # Allow large knowledge-base / file uploads.
    client_max_body_size 50m;

    # Backend API + WebSockets.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Everything else -> Next.js frontend.
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
