# AlgoWorkforce — Nginx virtual host (HTTP only)
# Certbot will automatically add the SSL/HTTPS block when you run:
#   certbot --nginx -d algoworkforce.com -d www.algoworkforce.com

server {
    listen 80;
    listen [::]:80;
    server_name algoworkforce.com www.algoworkforce.com;

    # Required for certbot SSL challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # WebSocket to FastAPI (legacy /ws/ path)
    location /ws/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebSocket to FastAPI (versioned /api/v1/ws/ path — used by the app's
    # live orchestration view and escalations real-time push). nginx matches
    # the longest prefix location, so this takes precedence over /api/ below
    # regardless of file order — but kept first here for readability.
    location /api/v1/ws/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API to FastAPI
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass         http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
