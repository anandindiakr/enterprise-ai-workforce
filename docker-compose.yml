services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-workforce/api:latest
    container_name: ai-workforce-api
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      POSTGRES_DSN: postgresql+asyncpg://workforce:workforce@postgres:5432/workforce
      MCP_BASE_URL: http://ai-workforce-api:8000
    depends_on:
      - redis
      - chroma
      - postgres
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── Celery worker ──────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-workforce/api:latest
    container_name: ai-workforce-worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      POSTGRES_DSN: postgresql+asyncpg://workforce:workforce@postgres:5432/workforce
      MCP_BASE_URL: http://ai-workforce-api:8000
    depends_on:
      - redis
      - api
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME", "--timeout", "5"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── Celery beat (periodic tasks) ───────────────────────────────────────────
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-workforce/api:latest
    container_name: ai-workforce-beat
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql+asyncpg://workforce:workforce@postgres:5432/workforce
    depends_on:
      - redis
      - worker
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 5 2>&1 | grep -q pong || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 2
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai-workforce-redis
    ports: []
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.5.9
    container_name: ai-workforce-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ai-workforce-postgres
    environment:
      POSTGRES_USER: workforce
      POSTGRES_PASSWORD: workforce
      POSTGRES_DB: workforce
    ports: []
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workforce"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-workforce-prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9191:9090"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Must be the PUBLIC address the browser can reach (NOT localhost) because
        # NEXT_PUBLIC_* values are baked into the JS bundle at build time and run
        # in the visitor's browser. Override per-deployment if the IP/domain changes.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://187.127.112.32:8080}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://187.127.112.32:8080}
    container_name: ai-workforce-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://187.127.112.32:8080}
      NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://187.127.112.32:8080}
    ports:
      - "3100:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
  chroma_data:
  postgres_data:
