services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-workforce/api:latest
    container_name: ai-workforce-api
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      POSTGRES_DSN: postgresql+asyncpg://workforce:workforce@postgres:5432/workforce
    depends_on:
      - redis
      - chroma
      - postgres
    ports:
      - "8080:8000"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai-workforce-redis
    ports: []
    volumes:
      - redis_data:/data
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:0.5.5
    container_name: ai-workforce-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ai-workforce-postgres
    environment:
      POSTGRES_USER: workforce
      POSTGRES_PASSWORD: workforce
      POSTGRES_DB: workforce
    ports: []
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-workforce-prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-workforce-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
  chroma_data:
  postgres_data:
